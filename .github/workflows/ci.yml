   name: Backend CI

   on:
     push:
       branches: [main]
     pull_request:
       branches: [main]

   jobs:
     test:
       name: Unit & Integration Tests
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@v2
           with:
             bun-version: latest
         - run: bun install --frozen-lockfile || bun install
         - run: bun test
   